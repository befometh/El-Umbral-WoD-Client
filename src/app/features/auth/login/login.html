<!-- Fondo con niebla y velas -->
<div class="umbral-root">
  <div class="umbral-bg"></div>
  <div class="deco-line left"></div>
  <div class="deco-line right"></div>
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>

  <div class="login-card">

    <!-- Símbolo ornamental -->
    <div class="ornament">
      <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="26" cy="26" r="24" stroke="#5c2d1a" stroke-width="0.5" opacity="0.6"/>
        <circle cx="26" cy="26" r="19" stroke="#3d1f0f" stroke-width="0.5" opacity="0.5"/>
        <line x1="26" y1="10" x2="26" y2="42" stroke="#8b4a2a" stroke-width="1"/>
        <line x1="10" y1="26" x2="42" y2="26" stroke="#8b4a2a" stroke-width="1"/>
        <polygon points="26,8 28,11 26,14 24,11" fill="#c8784a" opacity="0.9"/>
        <polygon points="26,38 28,41 26,44 24,41" fill="#c8784a" opacity="0.9"/>
        <polygon points="8,26 11,24 14,26 11,28"  fill="#c8784a" opacity="0.9"/>
        <polygon points="38,26 41,24 44,26 41,28" fill="#c8784a" opacity="0.9"/>
        <circle cx="26" cy="26" r="3"   fill="#d4804a"/>
        <circle cx="26" cy="26" r="1.5" fill="#f0b070"/>
      </svg>
    </div>

    <h1 class="login-title">El Umbral</h1>
    <p class="login-subtitle">Accede a la Mascarada</p>

    <!-- Divisor ornamental -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line right"></div>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" novalidate>

      <div class="field-group">
        <label class="field-label" for="email">Correo</label>
        <input
          id="email"
          class="field-input"
          type="email"
          placeholder="tu.nombre@clan.com"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Contraseña</label>
        <input
          id="password"
          class="field-input"
          type="password"
          placeholder="••••••••••"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
        />
      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="cargando()"
        [class.is-loading]="cargando()"
      >
        @if (cargando()) {
          <span class="loading-dots">
            <span></span><span></span><span></span>
          </span>
        } @else {
          ENTRAR AL UMBRAL
        }
      </button>

    </form>

    <!-- Mensaje de error -->
    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }

    <div class="login-footer">Mundo de Tinieblas · V20</div>

  </div>
</div>
